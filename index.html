<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五年級小考成績總覽</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#EEF2ED;
    --paper-line:#D3DCD2;
    --ink:#1E2B27;
    --ink-soft:#4B5A54;
    --pen-red:#C4433B;
    --pen-red-soft:#E7B4AE;
    --sage:#5C8A78;
    --card:#FBFAF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family: "Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 80px;}

  header{margin-bottom:28px;}
  .eyebrow{
    display:inline-block;
    font-size:13px;
    color:var(--sage);
    border:1.5px solid var(--sage);
    border-radius:3px;
    padding:2px 8px;
    transform:rotate(-2deg);
    margin-bottom:10px;
  }
  h1{font-size:32px;margin:0 0 6px;font-weight:700;letter-spacing:0.5px;}
  header p{margin:0;color:var(--ink-soft);font-size:14.5px;}

  nav.tabs{display:flex;gap:6px;margin:26px 0 22px;border-bottom:2px solid var(--ink);flex-wrap:wrap;}
  nav.tabs button{
    font-family:inherit;font-size:16px;font-weight:700;background:transparent;
    border:2px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;
    padding:9px 20px 8px;cursor:pointer;color:var(--ink-soft);position:relative;top:2px;
  }
  nav.tabs button.active{background:var(--card);color:var(--ink);top:2px;border-bottom:2px solid var(--card);}
  nav.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;position:relative;top:-1px;}
  nav.tabs button .dot.filled{background:var(--sage);}
  nav.tabs button .dot.empty{background:transparent;border:1.5px solid #B9C2B7;}

  nav.quiz-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  nav.quiz-tabs button{
    font-family:inherit;font-size:13.5px;font-weight:700;background:var(--paper);
    border:1.5px solid var(--paper-line);border-radius:16px;padding:6px 14px;
    cursor:pointer;color:var(--ink-soft);
  }
  nav.quiz-tabs button.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  .panel{background:var(--card);border:2px solid var(--ink);border-radius:0 10px 10px 10px;padding:28px;}

  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:22px;}
  .panel-head h2{margin:0;font-size:22px;}
  .panel-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .grade-stamp{
    width:104px;height:104px;border:4px solid var(--pen-red);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-6deg);color:var(--pen-red);flex-shrink:0;
  }
  .grade-stamp .num{font-size:30px;font-weight:800;line-height:1;}
  .grade-stamp .lbl{font-size:11px;margin-top:2px;letter-spacing:1px;}

  .stat-row{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .stat-box{background:var(--paper);border:1.5px solid var(--paper-line);border-radius:8px;padding:12px 18px;min-width:110px;}
  .stat-box .v{font-size:20px;font-weight:800;}
  .stat-box .k{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .stat-box.warn{border-color:var(--pen-red);}
  .stat-box.warn .v,.stat-box.warn .k{color:var(--pen-red);font-weight:800;}

  .chart-box{background:var(--paper);border:1.5px solid var(--paper-line);border-radius:8px;padding:18px 18px 8px;margin-bottom:24px;cursor:zoom-in;}
  .chart-box h3{margin:0 0 12px;font-size:14px;color:var(--ink-soft);font-weight:700;}
  .chart-box .canvas-wrap{position:relative;height:260px;}
  .zoom-hint{font-size:11.5px;color:#9AA69A;text-align:right;margin-top:6px;}

  .table-box{cursor:zoom-in;margin-bottom:24px;}
  table{width:100%;border-collapse:collapse;font-size:17px;}
  table caption{text-align:left;font-size:17px;color:var(--ink-soft);font-weight:700;margin-bottom:12px;}
  th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--paper-line);}
  th{color:var(--ink-soft);font-weight:700;font-size:14.5px;}
  td.score{font-weight:700;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty .icon{
    width:64px;height:64px;margin:0 auto 16px;border:2px dashed #B9C2B7;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:26px;transform:rotate(-3deg);
  }
  .empty p{margin:4px 0;font-size:14.5px;}
  .empty .small{font-size:12.5px;color:#9AA69A;}

  footer{margin-top:30px;text-align:center;color:#9AA69A;font-size:12px;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(30,43,39,0.55);
    align-items:center;justify-content:center;padding:24px;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card);border:2px solid var(--ink);border-radius:10px;
    padding:28px;width:100%;max-width:760px;max-height:85vh;overflow:auto;position:relative;
  }
  .modal-box h3{margin:0 0 18px;font-size:19px;padding-right:30px;}
  .modal-box .canvas-wrap-lg{position:relative;height:min(60vh,480px);}
  .modal-box table{font-size:22px;}
  .modal-box th,.modal-box td{padding:14px 10px;}
  .modal-close{
    position:absolute;top:16px;right:16px;width:32px;height:32px;
    border:2px solid var(--ink);border-radius:50%;background:var(--paper);
    cursor:pointer;font-size:16px;font-weight:700;line-height:1;color:var(--ink);
  }

  @media (max-width:560px){
    h1{font-size:26px;}
    .panel{padding:20px;}
    nav.tabs button{padding:8px 14px 7px;font-size:14.5px;}
    .grade-stamp{width:84px;height:84px;}
    .grade-stamp .num{font-size:24px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">小考成績紀錄</span>
    <h1>五年級成績總覽</h1>
    <p>506 · 507 · 508 · 509 · 510　各班分數級距、平均分數統計</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <nav class="quiz-tabs" id="quizTabs"></nav>
  <section class="panel" id="panel"></section>

  <footer>資料來源：各班小考成績登錄表</footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="關閉">✕</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// distribution arrays are ordered low → high (70以下 first, 100 last) —
// the chart reads them left-to-right in this order; the table shows
// high-to-low (reversed) for readability.
const QUIZZES = ["1-1","1-2","1-3","1-3-bonus","1-3-total","2-1","2-2"];

// Display wording per tab. Plain quizzes (1-1, 1-2, 1-3, ...) use the defaults;
// 加分 and 總分 have their own buckets, so they carry their own wording and
// the label of the "top" bucket that the 滿分 stat counts.
// 基本資料不完整：試算表儲存格標 z 的人數（成績照常計入級距與平均）
const INC = { key:"incomplete", label:"基本資料不完整", warn:true };
const QUIZ_META = {
  "1-3": { tab:"1-3 小考", title:"1-3 小考", dist:"分數級距", top:"100", avg:"平均分數", stamp:"班平均",
           topLabel:"滿分人數", extras:[INC], countLabel:"實際應試人數", sub:n=>`已收 ${n} 份` },
  "1-3-bonus": { tab:"1-3 加分", title:"1-3 加分", dist:"加分級距", top:"10",
                 avg:"平均加分", stamp:"平均加分", topLabel:"加滿 10 分人數",
                 extras:[{ key:"blank", label:"交白卷", warn:true }, INC],   // 交白卷：加分欄標記 x，視為 0 分計入級距與平均；'-' 為缺考，不列入
                 countLabel:"統計人數", sub:n=>`統計 ${n} 人` },
  "1-3-total": { tab:"1-3 總分", title:"1-3 總分", dist:"總分級距", top:"110",
                 avg:"平均分數", stamp:"班平均", topLabel:"110 分人數",
                 extras:[INC],
                 countLabel:"統計人數", sub:n=>`統計 ${n} 人` }
};
function quizMeta(q){
  return QUIZ_META[q] || { tab:`${q} 小考`, title:`${q} 小考`, dist:"分數級距", top:"100",
                           avg:"平均分數", stamp:"班平均", topLabel:"滿分人數",
                           countLabel:"實際應試人數", sub:n=>`已收 ${n} 份` };
}

const RAW = {
  "506": { "1-1": { average: 76.33, distribution: [
    { label:"70以下", count:6 },{ label:"70-79", count:5 },{ label:"80-89", count:9 },
    { label:"90-99", count:4 },{ label:"100", count:0 }
  ]},
  "1-2": { average: 83.58, distribution: [
    { label:"70以下", count:3 },{ label:"70-79", count:3 },{ label:"80-89", count:7 },
    { label:"90-99", count:10 },{ label:"100", count:1 }
  ]},
  "1-3": { average: 90.38, incomplete: 1, distribution: [
    { label:"70以下", count:2 }, { label:"70-79", count:0 }, { label:"80-89", count:4 }, { label:"90-99", count:14 }, { label:"100", count:4 }
  ]},
  "1-3-bonus": { average: 5.71, blank: 1, incomplete: 1, distribution: [
    { label:"7以下", count:15 }, { label:"8", count:3 }, { label:"9", count:0 }, { label:"10", count:6 }
  ]},
  "1-3-total": { average: 96.08, incomplete: 1, distribution: [
    { label:"80以下", count:2 }, { label:"80-89", count:0 }, { label:"90-99", count:9 }, { label:"100-109", count:10 }, { label:"110", count:3 }
  ]} },
  "507": { "1-1": { average: 77.84, distribution: [
    { label:"70以下", count:8 },{ label:"70-79", count:3 },{ label:"80-89", count:6 },
    { label:"90-99", count:8 },{ label:"100", count:0 }
  ]},
  "1-2": { average: 84.72, distribution: [
    { label:"70以下", count:2 },{ label:"70-79", count:5 },{ label:"80-89", count:8 },
    { label:"90-99", count:7 },{ label:"100", count:3 }
  ]},
  "1-3": { average: 92.33, incomplete: 3, distribution: [
    { label:"70以下", count:1 }, { label:"70-79", count:1 }, { label:"80-89", count:2 }, { label:"90-99", count:10 }, { label:"100", count:10 }
  ]},
  "1-3-bonus": { average: 7.17, blank: 2, incomplete: 3, distribution: [
    { label:"7以下", count:9 }, { label:"8", count:4 }, { label:"9", count:2 }, { label:"10", count:9 }
  ]},
  "1-3-total": { average: 99.5, incomplete: 3, distribution: [
    { label:"80以下", count:1 }, { label:"80-89", count:1 }, { label:"90-99", count:6 }, { label:"100-109", count:12 }, { label:"110", count:4 }
  ]} },
  "508": { "1-1": { average: 84.24, distribution: [
    { label:"70以下", count:2 },{ label:"70-79", count:5 },{ label:"80-89", count:7 },
    { label:"90-99", count:9 },{ label:"100", count:2 }
  ]},
  "1-2": { average: 87.04, distribution: [
    { label:"70以下", count:2 },{ label:"70-79", count:4 },{ label:"80-89", count:6 },
    { label:"90-99", count:11 },{ label:"100", count:2 }
  ]},
  "1-3": { average: 96.0, distribution: [
    { label:"70以下", count:0 }, { label:"70-79", count:0 }, { label:"80-89", count:2 }, { label:"90-99", count:14 }, { label:"100", count:9 }
  ]},
  "1-3-bonus": { average: 7.76, blank: 0, distribution: [
    { label:"7以下", count:6 }, { label:"8", count:7 }, { label:"9", count:1 }, { label:"10", count:11 }
  ]},
  "1-3-total": { average: 103.76, distribution: [
    { label:"80以下", count:0 }, { label:"80-89", count:0 }, { label:"90-99", count:5 }, { label:"100-109", count:16 }, { label:"110", count:4 }
  ]} },
  "509": { "1-1": { average: 80.88, distribution: [
    { label:"70以下", count:7 },{ label:"70-79", count:3 },{ label:"80-89", count:6 },
    { label:"90-99", count:7 },{ label:"100", count:2 }
  ]},
  "1-2": { average: 86.4, distribution: [
    { label:"70以下", count:2 },{ label:"70-79", count:2 },{ label:"80-89", count:9 },
    { label:"90-99", count:8 },{ label:"100", count:4 }
  ]},
  "1-3": { average: 94.88, distribution: [
    { label:"70以下", count:0 }, { label:"70-79", count:0 }, { label:"80-89", count:6 }, { label:"90-99", count:12 }, { label:"100", count:7 }
  ]},
  "1-3-bonus": { average: 6.08, blank: 0, distribution: [
    { label:"7以下", count:16 }, { label:"8", count:3 }, { label:"9", count:1 }, { label:"10", count:5 }
  ]},
  "1-3-total": { average: 100.96, distribution: [
    { label:"80以下", count:0 }, { label:"80-89", count:3 }, { label:"90-99", count:6 }, { label:"100-109", count:14 }, { label:"110", count:2 }
  ]} },
  "510": { "1-1": { average: 76.37, distribution: [
    { label:"70以下", count:7 },{ label:"70-79", count:7 },{ label:"80-89", count:7 },
    { label:"90-99", count:5 },{ label:"100", count:1 }
  ]},
  "1-2": { average: 83.85, distribution: [
    { label:"70以下", count:3 },{ label:"70-79", count:5 },{ label:"80-89", count:8 },
    { label:"90-99", count:10 },{ label:"100", count:1 }
  ]},
  "1-3": { average: 93.16, distribution: [
    { label:"70以下", count:1 }, { label:"70-79", count:0 }, { label:"80-89", count:4 }, { label:"90-99", count:13 }, { label:"100", count:7 }
  ]},
  "1-3-bonus": { average: 6.4, blank: 2, distribution: [
    { label:"7以下", count:12 }, { label:"8", count:9 }, { label:"9", count:2 }, { label:"10", count:2 }
  ]},
  "1-3-total": { average: 99.56, distribution: [
    { label:"80以下", count:1 }, { label:"80-89", count:2 }, { label:"90-99", count:5 }, { label:"100-109", count:16 }, { label:"110", count:1 }
  ]} }
};

const classes = Object.keys(RAW);
let current = null; // no class selected when the page opens
let currentQuiz = "1-1";
let chartInstance = null;
let modalChart = null;

function classHasAnyData(c){
  return QUIZZES.some(q => RAW[c][q]);
}

function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = classes.map(c => {
    const ready = classHasAnyData(c);
    return `<button data-c="${c}" class="${c===current?'active':''}">
      <span class="dot ${ready?'filled':'empty'}"></span>${c} 班
    </button>`;
  }).join("");
  tabsEl.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      current = b.dataset.c;
      if (!RAW[current][currentQuiz]) {
        const firstReady = QUIZZES.find(q => RAW[current][q]);
        currentQuiz = firstReady || "1-1";
      }
      renderTabs(); renderQuizTabs(); renderPanel();
    });
  });
}

function renderQuizTabs(){
  const el = document.getElementById("quizTabs");
  if (!current){ el.innerHTML = ""; return; }
  el.innerHTML = QUIZZES.map(q => {
    const ready = !!RAW[current][q];
    return `<button data-q="${q}" class="${q===currentQuiz?'active':''}">${quizMeta(q).tab}${ready?'':'（尚無）'}</button>`;
  }).join("");
  el.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ currentQuiz = b.dataset.q; renderQuizTabs(); renderPanel(); });
  });
}

function chartConfig(distribution){
  return {
    type: "bar",
    data: {
      labels: distribution.map(x=>x.label),
      datasets: [{
        data: distribution.map(x=>x.count),
        backgroundColor: "#5C8A78",
        borderRadius: 4,
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero:true, ticks:{ stepSize:1, color:"#4B5A54" }, grid:{ color:"#D3DCD2" } },
        x: { ticks:{ color:"#4B5A54" }, grid:{ display:false } }
      }
    }
  };
}

function tableHtml(distribution){
  return `
    <table>
      <caption>${current} 班｜${quizMeta(currentQuiz).title}｜${quizMeta(currentQuiz).dist}統計</caption>
      <thead><tr><th>級距</th><th>人數</th></tr></thead>
      <tbody>
        ${[...distribution].reverse().map(x => `
          <tr><td>${x.label}</td><td class="score">${x.count}</td></tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function renderPanel(){
  const panelEl = document.getElementById("panel");

  if (chartInstance){ chartInstance.destroy(); chartInstance = null; }

  if (!current){
    panelEl.innerHTML = `
      <div class="empty">
        <div class="icon">?</div>
        <p>請先選擇班級。</p>
        <p class="small">點選上方的班級，就會顯示該班的小考成績。</p>
      </div>
    `;
    return;
  }

  const d = RAW[current][currentQuiz];

  if (!d){
    panelEl.innerHTML = `
      <div class="panel-head"><div><h2>${current} 班</h2><div class="sub">${quizMeta(currentQuiz).title}｜尚未登錄成績</div></div></div>
      <div class="empty">
        <div class="icon">?</div>
        <p>這次小考還沒有成績資料。</p>
        <p class="small">登錄後，這裡會自動出現分數級距、平均分數與統計圖表。</p>
      </div>
    `;
    return;
  }

  const submittedCount = d.distribution.reduce((sum, x) => sum + x.count, 0);
  const m = quizMeta(currentQuiz);
  const topCount = d.distribution.find(x => x.label === m.top)?.count ?? 0;
  // 交白卷／基本資料不完整：為 0 時不顯示，大於 0 時紅字凸顯
  const extraBox = (m.extras || []).filter(x => (d[x.key] ?? 0) > 0).map(x =>
    `<div class="stat-box warn"><div class="v">${d[x.key]}</div><div class="k">${x.label}</div></div>`).join("");
  const avgDisplay = d.average.toFixed(1);

  panelEl.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${current} 班</h2>
        <div class="sub">${m.title} · ${m.sub(submittedCount)}</div>
      </div>
      <div class="grade-stamp">
        <div class="num">${avgDisplay}</div>
        <div class="lbl">${m.stamp}</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-box"><div class="v">${avgDisplay}</div><div class="k">${m.avg}</div></div>
      <div class="stat-box"><div class="v">${topCount}</div><div class="k">${m.topLabel}</div></div>
      ${extraBox}
      <div class="stat-box"><div class="v">${submittedCount}</div><div class="k">${m.countLabel}</div></div>
    </div>

    <div class="table-box" id="tableWrap">
      ${tableHtml(d.distribution)}
      <div class="zoom-hint">點擊表格放大檢視</div>
    </div>

    <div class="chart-box" id="chartWrap">
      <h3>${m.title}｜${m.dist}人數分布</h3>
      <div class="canvas-wrap"><canvas id="distChart"></canvas></div>
      <div class="zoom-hint">點擊圖表放大檢視</div>
    </div>
  `;

  const ctx = document.getElementById("distChart").getContext("2d");
  chartInstance = new Chart(ctx, chartConfig(d.distribution));

  document.getElementById("chartWrap").addEventListener("click", () => openModalChart(d.distribution));
  document.getElementById("tableWrap").addEventListener("click", () => openModalTable(d.distribution));
}

function openModalBase(title){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalOverlay").classList.add("open");
  if (modalChart){ modalChart.destroy(); modalChart = null; }
}

function openModalChart(distribution){
  openModalBase(`${current} 班｜${quizMeta(currentQuiz).title}｜${quizMeta(currentQuiz).dist}人數分布`);
  document.getElementById("modalBody").innerHTML = `<div class="canvas-wrap-lg"><canvas id="distChartLg"></canvas></div>`;
  const ctxLg = document.getElementById("distChartLg").getContext("2d");
  modalChart = new Chart(ctxLg, chartConfig(distribution));
}

function openModalTable(distribution){
  openModalBase(`${current} 班｜${quizMeta(currentQuiz).title}｜${quizMeta(currentQuiz).dist}統計`);
  document.getElementById("modalBody").innerHTML = tableHtml(distribution).replace(/<caption>.*?<\/caption>/, "");
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
  if (modalChart){ modalChart.destroy(); modalChart = null; }
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

renderTabs();
renderQuizTabs();
renderPanel();
</script>
</body>
</html>
